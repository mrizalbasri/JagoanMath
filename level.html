<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JagonMatika - Select Difficulty</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="css/bootstrap-custom.css" rel="stylesheet">

  <style>
    .difficulty-card {
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }
    .difficulty-card:hover {
      transform: translateY(-8px);
    }
  </style>
</head>
<body class="bg-background text-on-background d-flex flex-column min-vh-100">

  <!-- TopAppBar (Added) -->
  <header class="bg-surface shadow-sm sticky-top" style="top: 0; z-index: 1030;">
    <nav class="navbar navbar-expand-md px-3 px-md-5 py-3">
      <div class="container-fluid">
        <!-- Brand Logo Only -->
        <h1 class="navbar-brand mb-0 fw-bold text-primary" style="font-size: 24px;">Jagoan Math</h1>

        <!-- Right Side Items -->
        <div class="d-flex align-items-center gap-3 ms-auto">
          <button class="btn btn-link text-on-surface-variant p-0" type="button" title="Settings">
            <span class="material-symbols-outlined">settings</span>
          </button>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="flex-grow-1 d-flex flex-column align-items-center justify-content-center px-3 py-5">
    <div class="container-max">
      <!-- Header Section -->
      <div class="w-100 mb-5">
        <!-- Back Button (Responsive) -->
        <button class="btn d-flex d-md-none align-items-center justify-content-center chunky-button-secondary mb-4" style="width: 48px; height: 48px; border-radius: 50%; background-color: var(--surface-container); border: none;">
          <span class="material-symbols-outlined">arrow_back_ios_new</span>
        </button>

        <!-- Content Section -->
        <div class="w-100 d-flex flex-column align-items-center">
          <!-- Icon -->
          <div class="rounded-circle bg-primary-light text-on-primary-container d-flex align-items-center justify-content-center mb-4" style="width: 80px; height: 80px; box-shadow: 0 2px 8px rgba(0, 88, 189, 0.1);">
            <span class="material-symbols-outlined" style="font-size: 36px;">calculate</span>
          </div>

          <!-- Title -->
          <h1 class="headline-lg-mobile headline-xl text-primary text-center mb-2">Pilih Level Kesulitan</h1>
          <p class="body-lg text-on-surface-variant text-center" style="max-width: 600px;">Seberapa menantang soal yang ingin kamu kerjakan hari ini?</p>
        </div>
      </div>

      <!-- Difficulty Selection Cards -->
      <div class="row g-4 w-100 justify-content-center" style="max-width: 900px; margin: 0 auto;">
        <!-- Easy Card -->
        <div class="col-12 col-md-4">
          <button class="btn btn-light w-100 h-100 p-4 rounded-4 card-shadow difficulty-card border border-2 text-start position-relative overflow-hidden d-flex flex-column align-items-center" style="border-color: var(--surface-container-high); min-height: 400px;">
            <div class="position-absolute inset-0 opacity-0" style="background-color: var(--tertiary-container); transition: opacity 0.3s;"></div>

            <!-- Icon -->
            <div class="rounded-circle bg-tertiary-fixed text-on-tertiary-fixed d-flex align-items-center justify-content-center mb-4" style="width: 96px; height: 96px; box-shadow: 0 2px 8px rgba(0, 88, 189, 0.1);">
              <span class="material-symbols-outlined" style="font-size: 40px;">emoji_nature</span>
            </div>

            <!-- Title -->
            <h2 class="headline-lg text-tertiary mb-3 text-center w-100">Mudah</h2>

            <!-- Badge -->
            <div class="bg-surface-container px-3 py-2 rounded-pill mb-3">
              <span class="label-lg text-on-surface-variant">Numbers 1-10</span>
            </div>

            <!-- Description -->
            <p class="body-md text-on-surface-variant text-center">Cocok untuk pemanasan! Mari mulai dengan angka-angka kecil dan bersenang-senang.</p>

            <!-- Button -->
            <div class="mt-auto w-100 py-3 rounded-2 bg-tertiary text-on-tertiary label-lg text-center chunky-button-tertiary">
              Mulai Mudah
            </div>
          </button>
        </div>

        <!-- Medium Card (Featured) -->
        <div class="col-12 col-md-4">
          <button class="btn btn-light w-100 h-100 p-4 rounded-4 card-shadow difficulty-card border border-2 text-start position-relative overflow-hidden d-flex flex-column align-items-center" style="border-color: var(--surface-container-high); border-top: 3px solid var(--primary); min-height: 400px; transform: scale(1.05); box-shadow: 0 8px 24px rgba(0, 88, 189, 0.1);">
            <div class="position-absolute top-0 start-0 end-0" style="height: 3px; background-color: var(--primary);"></div>

            <!-- Icon -->
            <div class="rounded-circle bg-primary-fixed text-on-primary-fixed d-flex align-items-center justify-content-center mb-4" style="width: 96px; height: 96px; box-shadow: 0 2px 8px rgba(0, 88, 189, 0.1);">
              <span class="material-symbols-outlined" style="font-size: 40px;">rocket_launch</span>
            </div>

            <!-- Title -->
            <h2 class="headline-lg text-primary mb-3 text-center w-100">Sedang</h2>

            <!-- Badge -->
            <div class="bg-surface-container px-3 py-2 rounded-pill mb-3">
              <span class="label-lg text-on-surface-variant">Numbers 1-50</span>
            </div>

            <!-- Description -->
            <p class="body-md text-on-surface-variant text-center">Siap untuk tantangan? Uji kemampuanmu dengan angka yang lebih besar.</p>

            <!-- Button -->
            <div class="mt-auto w-100 py-3 rounded-2 bg-primary text-on-primary label-lg text-center chunky-button-primary">
              Mulai Sedang
            </div>
          </button>
        </div>

        <!-- Hard Card -->
        <div class="col-12 col-md-4">
          <button class="btn btn-light w-100 h-100 p-4 rounded-4 card-shadow difficulty-card border border-2 text-start position-relative overflow-hidden d-flex flex-column align-items-center" style="border-color: var(--surface-container-high); min-height: 400px;">
            <div class="position-absolute inset-0 opacity-0" style="background-color: var(--secondary-container); transition: opacity 0.3s;"></div>

            <!-- Icon -->
            <div class="rounded-circle bg-secondary-container text-on-secondary-container d-flex align-items-center justify-content-center mb-4" style="width: 96px; height: 96px; box-shadow: 0 2px 8px rgba(0, 88, 189, 0.1);">
              <span class="material-symbols-outlined" style="font-size: 40px;">local_fire_department</span>
            </div>

            <!-- Title -->
            <h2 class="headline-lg text-secondary mb-3 text-center w-100">Sulit</h2>

            <!-- Badge -->
            <div class="bg-surface-container px-3 py-2 rounded-pill mb-3">
              <span class="label-lg text-on-surface-variant">Numbers 1-100</span>
            </div>

            <!-- Description -->
            <p class="body-md text-on-surface-variant text-center">Hanya untuk para ahli! Taklukkan angka-angka besar dan jadilah juara.</p>

            <!-- Button -->
            <div class="mt-auto w-100 py-3 rounded-2 bg-secondary text-on-secondary label-lg text-center chunky-button-secondary">
              Mulai Sulit
            </div>
          </button>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-surface-container-low border-top footer mt-auto">
    <div class="text-center py-3 px-3">
      <p class="body-md text-on-surface-variant mb-0">© 2026 Jagoan Math</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
