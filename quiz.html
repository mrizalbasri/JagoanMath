<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JagonMatika - Quiz Aktif</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Lexend:wght@400;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="css/bootstrap-custom.css" rel="stylesheet">

  <style>
    html, body {
      min-height: 100%;
      overflow-x: hidden;
    }
    .quiz-option {
      transition: all 0.2s ease;
    }
    .quiz-option:hover:not(:disabled) {
      background-color: rgba(0, 88, 189, 0.05);
      transform: translateY(-2px);
    }
    .jawaban-benar { background-color: #d4edda !important; border-color: #28a745 !important; border-bottom-color: #28a745 !important; }
    .jawaban-salah { background-color: #f8d7da !important; border-color: #dc3545 !important; border-bottom-color: #dc3545 !important; }

    /* Question display - besar dan jelas */
    .question-display {
      font-size: clamp(2.5rem, 10vw, 5rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      line-height: 1.2;
    }

    /* Option buttons - lebih besar */
    .option-badge {
      width: 48px;
      height: 48px;
      font-size: 18px;
      font-weight: bold;
      flex-shrink: 0;
    }
    .quiz-option {
      padding: 1rem 1.25rem;
    }
    .quiz-option .answer-text {
      font-size: 1.5rem;
      font-weight: 600;
    }

    @media (max-width: 767px) {
      .option-badge {
        width: 36px;
        height: 36px;
        font-size: 14px;
      }
      .quiz-option {
        padding: 0.6rem 0.75rem;
      }
      .quiz-option .answer-text {
        font-size: 1.1rem;
      }
      .question-card {
        padding: 1.25rem 1rem !important;
        border-radius: 1rem !important;
      }
      .question-display {
        font-size: clamp(2rem, 8vw, 3.5rem) !important;
      }
      .progress.mb-4 {
        margin-bottom: 0.75rem !important;
      }
    }
  </style>
</head>
<body class="bg-background text-on-surface d-flex flex-column min-vh-100">

  <!-- TopAppBar - Compact -->
  <header class="bg-surface shadow-sm" style="z-index: 1030;">
    <nav class="navbar px-3 py-2">
      <div class="container-fluid">
        <div class="d-flex align-items-center gap-2">
          <span class="material-symbols-outlined text-primary" style="font-size: 24px;">calculate</span>
          <h1 class="navbar-brand mb-0 fw-bold text-primary" style="font-size: 18px;">Jagoan Math</h1>
        </div>
        <div class="d-flex align-items-center gap-2">
          <span id="nama-profil" class="d-none d-sm-inline text-primary fw-bold" style="font-size: 14px;">Student</span>
          <div class="rounded-circle overflow-hidden border border-2" style="width: 36px; height: 36px; border-color: var(--primary-container);">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6DLkflinmLm5KG6Y__Ru26AyK4vCIuiMcY1AZ6nGTFMRv4qrf6HcEwAFs0xkxsxJ33hkEyTNTby_0nG5usuISSfrpc5S4eZBHGODbP037zYMvHjjuaWs_ANxW3uFAB4bFFlOGNvkwkhBKeDFxm4YIfFT9eC2Yay4Uh0AgbPJvEiXperqhcJhcTMeq_xQqJpVeTmFo_c3CjvLvzck_oRH0DkP-XkqJ7xTBiOB857dLj4JYcTi-wzSFAME2p36yuQvWDgJgM5pJ5lcj" alt="Avatar" class="w-100 h-100 object-fit-cover">
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="flex-grow-1 px-3 py-3 d-flex align-items-center">
    <div class="container-max mx-auto w-100" style="max-width: 700px;">

      <!-- Progress Row -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <span id="teks-nomor-soal" class="fw-bold text-primary">Soal 1/10</span>
        <div class="d-flex align-items-center gap-1 px-2 py-1 rounded-pill" style="background: var(--error-container);">
          <span class="material-symbols-outlined text-error" style="font-size: 16px;">timer</span>
          <span id="teks-timer" class="fw-bold text-error">00:30</span>
          <div id="bar-timer" class="d-none"></div>
        </div>
      </div>

      <!-- Progress Bar -->
      <div class="progress mb-4" style="height: 8px; border-radius: 50px;">
        <div id="progress-bar-soal" class="progress-bar" style="width: 10%; background: linear-gradient(90deg, var(--tertiary), var(--tertiary-fixed));"></div>
      </div>

      <!-- Question Card -->
      <div class="question-card text-center position-relative overflow-hidden mb-4" style="background: linear-gradient(135deg, var(--primary-container) 0%, var(--surface-container-lowest) 50%, var(--tertiary-container) 100%); border-radius: 1.25rem; padding: 2rem 1.5rem; border: 2px solid var(--primary-fixed);">
        <!-- Decorative -->
        <div class="position-absolute" style="top: -15px; right: -15px; width: 50px; height: 50px; background: var(--tertiary-fixed); border-radius: 50%; opacity: 0.3;"></div>
        <div class="position-absolute" style="bottom: -10px; left: -10px; width: 40px; height: 40px; background: var(--primary); border-radius: 50%; opacity: 0.15;"></div>

        <!-- Category Badge -->
        <div class="d-inline-flex align-items-center gap-1 mb-3 px-3 py-1 rounded-pill" style="background: var(--primary); color: var(--on-primary); font-size: 0.8rem;">
          <span class="material-symbols-outlined" style="font-size: 16px;">category</span>
          <span id="label-kategori">Kategori</span>
          <span id="status-level" class="d-none"></span>
        </div>

        <!-- Question -->
        <h3 id="teks-pertanyaan" class="question-display text-on-surface mb-0">
          ? + ? = ?
        </h3>
      </div>

      <!-- Answer Options - 2x2 Grid -->
      <div class="row g-3" id="wadah-opsi">
        <div class="col-6">
          <button id="btn-opsi-0" class="btn w-100 rounded-3 border border-2 bg-surface-container-lowest quiz-option d-flex align-items-center gap-3 chunky-button-primary" style="border-color: var(--primary-container);">
            <div class="bg-primary text-on-primary rounded-2 d-flex align-items-center justify-content-center option-badge">A</div>
            <span id="teks-opsi-0" class="answer-text text-on-surface">...</span>
          </button>
        </div>
        <div class="col-6">
          <button id="btn-opsi-1" class="btn w-100 rounded-3 border border-2 bg-surface-container-lowest quiz-option d-flex align-items-center gap-3 chunky-button-secondary" style="border-color: var(--secondary);">
            <div class="bg-secondary text-on-secondary rounded-2 d-flex align-items-center justify-content-center option-badge">B</div>
            <span id="teks-opsi-1" class="answer-text text-on-surface">...</span>
          </button>
        </div>
        <div class="col-6">
          <button id="btn-opsi-2" class="btn w-100 rounded-3 border border-2 bg-surface-container-lowest quiz-option d-flex align-items-center gap-3 chunky-button-tertiary" style="border-color: var(--tertiary);">
            <div class="bg-tertiary text-on-tertiary rounded-2 d-flex align-items-center justify-content-center option-badge">C</div>
            <span id="teks-opsi-2" class="answer-text text-on-surface">...</span>
          </button>
        </div>
        <div class="col-6">
          <button id="btn-opsi-3" class="btn w-100 rounded-3 border border-2 bg-surface-container-lowest quiz-option d-flex align-items-center gap-3" style="border-bottom: 4px solid var(--error) !important;">
            <div class="bg-error text-on-error rounded-2 d-flex align-items-center justify-content-center option-badge">D</div>
            <span id="teks-opsi-3" class="answer-text text-on-surface">...</span>
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Footer - Minimal -->
  <footer class="bg-surface-container-low border-top">
    <div class="text-center py-1 px-3">
      <p class="text-on-surface-variant mb-0" style="font-size: 0.7rem;">© 2025 Jagoan Math</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/quiz.js"></script>
</body>
</html>
