<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JagonMatika - Hasil Belajar</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Lexend:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">

  <!-- Custom CSS -->
  <link href="css/bootstrap-custom.css" rel="stylesheet">

  <style>
    html, body {
      height: 100%;
      overflow: hidden;
    }
    .score-display {
      font-size: clamp(3rem, 12vw, 5rem);
      font-weight: 700;
      line-height: 1;
    }
    .stat-card {
      transition: transform 0.2s ease;
    }
    .stat-card:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body class="bg-surface text-on-surface d-flex flex-column min-vh-100">

  <!-- TopAppBar -->
  <header class="bg-surface shadow-sm" style="z-index: 1030;">
    <nav class="navbar px-3 px-md-4 py-2">
      <div class="container-fluid">
        <div class="d-flex align-items-center gap-2">
          <span class="material-symbols-outlined text-primary" style="font-size: 24px;">calculate</span>
          <h1 class="navbar-brand mb-0 fw-bold text-primary" style="font-size: 20px;">Jagoan Math</h1>
        </div>
        <div class="d-flex align-items-center gap-2 ms-auto">
          <span id="nama-profil" class="d-none d-sm-inline text-primary fw-bold" style="font-size: 14px;">Student</span>
          <div class="rounded-circle overflow-hidden border border-2" style="width: 36px; height: 36px; border-color: var(--primary-container);">
            <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6DLkflinmLm5KG6Y__Ru26AyK4vCIuiMcY1AZ6nGTFMRv4qrf6HcEwAFs0xkxsxJ33hkEyTNTby_0nG5usuISSfrpc5S4eZBHGODbP037zYMvHjjuaWs_ANxW3uFAB4bFFlOGNvkwkhBKeDFxm4YIfFT9eC2Yay4Uh0AgbPJvEiXperqhcJhcTMeq_xQqJpVeTmFo_c3CjvLvzck_oRH0DkP-XkqJ7xTBiOB857dLj4JYcTi-wzSFAME2p36yuQvWDgJgM5pJ5lcj" alt="Avatar" class="w-100 h-100 object-fit-cover">
          </div>
        </div>
      </div>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="flex-grow-1 d-flex align-items-center justify-content-center px-3 py-3">
    <div class="w-100" style="max-width: 500px;">

      <!-- Trophy & Title -->
      <div class="text-center mb-4">
        <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-tertiary-fixed mb-3" style="width: 80px; height: 80px;">
          <span class="material-symbols-outlined text-tertiary" style="font-size: 40px;">emoji_events</span>
        </div>
        <h1 class="text-primary fw-bold mb-1" style="font-size: clamp(1.25rem, 4vw, 1.75rem);">Hebat! Kamu Selesai!</h1>
        <p class="text-on-surface-variant mb-0" style="font-size: 0.9rem;">Petualangan matematika hari ini selesai</p>
      </div>

      <!-- Score Card -->
      <div class="text-center bg-gradient rounded-4 p-4 mb-4 position-relative overflow-hidden" style="background: linear-gradient(135deg, var(--primary-container) 0%, var(--tertiary-container) 100%); border: 2px solid var(--primary-fixed);">
        <div class="position-absolute" style="top: -10px; right: -10px; width: 40px; height: 40px; background: var(--tertiary-fixed); border-radius: 50%; opacity: 0.3;"></div>
        <div class="position-absolute" style="bottom: -10px; left: -10px; width: 30px; height: 30px; background: var(--primary); border-radius: 50%; opacity: 0.15;"></div>

        <p class="text-on-surface-variant text-uppercase fw-bold mb-1" style="font-size: 0.75rem; letter-spacing: 1px;">Skor Kamu</p>
        <div id="skor-akhir" class="score-display text-primary">0</div>
        <p class="text-on-surface-variant mb-0" style="font-size: 0.85rem;">dari 100 poin</p>
      </div>

      <!-- Stats Grid -->
      <div class="row g-2 mb-4">
        <div class="col-4">
          <div class="stat-card bg-surface-container-low rounded-3 p-3 text-center border" style="border-color: var(--surface-container-highest);">
            <span class="material-symbols-outlined text-secondary mb-1" style="font-size: 24px;">person</span>
            <p class="text-on-surface-variant mb-0" style="font-size: 0.7rem;">Nama</p>
            <p id="summary-nama" class="text-on-surface fw-bold mb-0" style="font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Student</p>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-card bg-surface-container-low rounded-3 p-3 text-center border" style="border-color: var(--surface-container-highest);">
            <span class="material-symbols-outlined text-tertiary mb-1" style="font-size: 24px;">check_circle</span>
            <p class="text-on-surface-variant mb-0" style="font-size: 0.7rem;">Benar</p>
            <p id="summary-benar" class="text-on-surface fw-bold mb-0" style="font-size: 0.85rem;">0/10</p>
          </div>
        </div>
        <div class="col-4">
          <div class="stat-card bg-surface-container-low rounded-3 p-3 text-center border" style="border-color: var(--surface-container-highest);">
            <span class="material-symbols-outlined text-primary mb-1" style="font-size: 24px;">calendar_today</span>
            <p class="text-on-surface-variant mb-0" style="font-size: 0.7rem;">Tanggal</p>
            <p id="summary-tanggal" class="text-on-surface fw-bold mb-0" style="font-size: 0.85rem;">-</p>
          </div>
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="d-flex gap-2">
        <button id="btn-main-lagi" class="btn btn-tertiary chunky-button-tertiary flex-grow-1 d-flex align-items-center justify-content-center gap-2" style="padding: 12px 16px; font-size: 1rem;">
          <span class="material-symbols-outlined" style="font-size: 20px;">play_arrow</span>
          Main Lagi
        </button>
        <button id="btn-keluar" class="btn d-flex align-items-center justify-content-center gap-2" style="padding: 12px 16px; font-size: 1rem; background-color: var(--surface-container-highest); color: var(--on-surface-variant); border-bottom: 3px solid var(--outline);">
          <span class="material-symbols-outlined" style="font-size: 20px;">logout</span>
          Keluar
        </button>
      </div>

    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-surface-container-low border-top">
    <div class="text-center py-1 px-3">
      <p class="text-on-surface-variant mb-0" style="font-size: 0.7rem;">© 2026 Jagoan Math</p>
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/results.js"></script>
</body>
</html>
